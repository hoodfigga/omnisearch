[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisearch"
version = "2.2.0"
description = "Universal file, direct download, and everything discovery engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "rich>=13.7.0"
]

[project.scripts]
omnisearch = "omnisearch.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
